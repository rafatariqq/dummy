<!-- Bagian Dashboard Admin (Tersembunyi secara default sebelum login) -->
  <div id="adminDashboard" class="hidden min-h-screen bg-slate-100 py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto space-y-8">
      
      <!-- Header Dashboard -->
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Panel Admin / Petugas</span>
          <h1 class="font-display font-extrabold text-2xl text-slate-900 mt-1">Manajemen Puskesmas Satelit Tarailu</h1>
          <p class="text-xs text-slate-500">Kelola jadwal dokter, tenaga medis, dan daftar FAQ dengan mudah.</p>
        </div>
        <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs flex items-center gap-2 shadow-md transition-all">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar (Logout)
        </button>
      </div>

      <!-- Tab Navigasi Admin -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- MANAJEMEN DOKTER -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
          <div class="flex items-center justify-between">
            <h3 class="font-display font-bold text-lg text-slate-900 flex items-center gap-2">
              <i class="fa-solid fa-user-doctor text-emerald-600"></i> Kelola Jadwal Dokter
            </h3>
            <button onclick="openDoctorModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-plus"></i> Tambah Dokter
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-600 uppercase">
                <tr>
                  <th class="p-3 rounded-l-xl">Nama & Poli</th>
                  <th class="p-3">Hari & Jam</th>
                  <th class="p-3 text-right rounded-r-xl">Aksi</th>
                </tr>
              </thead>
              <tbody id="adminDoctorsTableBody" class="divide-y divide-slate-100">
                <!-- Data akan dimuat secara dinamis via JS -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- MANAJEMEN FAQ -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
          <div class="flex items-center justify-between">
            <h3 class="font-display font-bold text-lg text-slate-900 flex items-center gap-2">
              <i class="fa-solid fa-circle-question text-emerald-600"></i> Kelola FAQ
            </h3>
            <button onclick="openFaqModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-plus"></i> Tambah FAQ
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-600 uppercase">
                <tr>
                  <th class="p-3 rounded-l-xl">Pertanyaan</th>
                  <th class="p-3 text-right rounded-r-xl">Aksi</th>
                </tr>
              </thead>
              <tbody id="adminFaqTableBody" class="divide-y divide-slate-100">
                <!-- Data akan dimuat secara dinamis via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- MODAL FORM TAMBAH/EDIT DOKTER -->
  <div id="doctorModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 id="doctorModalTitle" class="font-display font-bold text-lg text-slate-900 mb-4">Tambah Data Dokter</h3>
      <form id="doctorForm" onsubmit="saveDoctor(event)" class="space-y-3 text-xs">
        <input type="hidden" id="doctorId">
        <div>
          <label class="font-semibold text-slate-700">Nama Lengkap & Gelar</label>
          <input type="text" id="docName" required class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div>
          <label class="font-semibold text-slate-700">Jabatan / Keterangan</label>
          <input type="text" id="docTitle" required placeholder="Contoh: Dokter Umum Faskes 1" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div>
          <label class="font-semibold text-slate-700">Nama Poli / Spesialisasi</label>
          <input type="text" id="docSpecialty" required placeholder="Contoh: Poli Umum" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div>
          <label class="font-semibold text-slate-700">Hari Praktik (pisahkan koma)</label>
          <input type="text" id="docDays" required placeholder="Senin,Rabu,Jumat" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div>
          <label class="font-semibold text-slate-700">Jam Praktik</label>
          <input type="text" id="docTime" required placeholder="08:00 - 12:00" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal('doctorModal')" class="px-4 py-2 bg-slate-100 rounded-xl font-semibold">Batal</button>
          <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl font-bold shadow-md">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL FORM TAMBAH/EDIT FAQ -->
  <div id="faqModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 id="faqModalTitle" class="font-display font-bold text-lg text-slate-900 mb-4">Tambah Data FAQ</h3>
      <form id="faqForm" onsubmit="saveFaq(event)" class="space-y-3 text-xs">
        <input type="hidden" id="faqId">
        <div>
          <label class="font-semibold text-slate-700">Pertanyaan</label>
          <input type="text" id="faqQuestion" required class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div>
          <label class="font-semibold text-slate-700">Jawaban</label>
          <textarea id="faqAnswer" rows="3" required class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal('faqModal')" class="px-4 py-2 bg-slate-100 rounded-xl font-semibold">Batal</button>
          <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl font-bold shadow-md">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic & Supabase Integration -->
  <script>
    // ==========================================
    // KONFIGURASI SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://paofqksfdajcylhnzpki.supabase.co';       
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhb2Zxa3NmZGFqY3lsaG56cGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTQ1NTksImV4cCI6MjEwNTg5MDU1OX0.sLCTWqZJIMWPsf9kMtOTYSDp-YL_ImU4ncGPVAK4I_g'; 

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Load data otomatis saat halaman dibuka
    document.addEventListener("DOMContentLoaded", () => {
      loadPublicDoctors();
      loadPublicFaqs();
    });

    // 1. MEMUAT DATA DOKTER KE HALAMAN UTAMA & ADMIN
    async function loadPublicDoctors() {
      const { data, error } = await db.from('doctors').select('*').order('id', { ascending: true });
      if (error) { console.error('Gagal memuat dokter:', error); return; }

      const grid = document.getElementById('doctorsGrid');
      const adminTable = document.getElementById('adminDoctorsTableBody');
      if (grid) grid.innerHTML = '';
      if (adminTable) adminTable.innerHTML = '';

      data.forEach(doc => {
        // Render ke Halaman Publik
        if (grid) {
          grid.innerHTML += `
            <div class="doctor-card bg-slate-50 rounded-2xl p-5 border border-slate-200" data-days="${doc.days}" data-search="${doc.name.toLowerCase()} ${doc.specialty.toLowerCase()}">
              <div class="flex items-start gap-4">
                <div class="w-14 h-14 bg-emerald-700 text-white rounded-2xl flex items-center justify-center text-xl font-bold shrink-0">
                  <i class="fa-solid fa-user-doctor"></i>
                </div>
                <div>
                  <span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">${doc.specialty}</span>
                  <h4 class="font-display font-bold text-slate-900 text-sm mt-1">${doc.name}</h4>
                  <p class="text-xs text-slate-500">${doc.title}</p>
                </div>
              </div>
              <div class="mt-4 pt-3 border-t border-slate-200 flex justify-between items-center text-xs text-slate-600">
                <span><i class="fa-regular fa-calendar text-emerald-600 mr-1"></i> ${doc.days}</span>
                <span class="font-semibold text-slate-800">${doc.time}</span>
              </div>
            </div>`;
        }

        // Render ke Tabel Admin
        if (adminTable) {
          adminTable.innerHTML += `
            <tr>
              <td class="p-3">
                <div class="font-bold text-slate-900">${doc.name}</div>
                <div class="text-[10px] text-slate-500">${doc.specialty}</div>
              </td>
              <td class="p-3">${doc.days} (${doc.time})</td>
              <td class="p-3 text-right space-x-2">
                <button onclick="editDoctor(${doc.id}, '${doc.name}', '${doc.title}', '${doc.specialty}', '${doc.days}', '${doc.time}')" class="text-amber-600 font-bold hover:underline">Edit</button>
                <button onclick="deleteDoctor(${doc.id})" class="text-rose-600 font-bold hover:underline">Hapus</button>
              </td>
            </tr>`;
        }
      });
    }

    // 2. MEMUAT DATA FAQ KE HALAMAN UTAMA & ADMIN
    async function loadPublicFaqs() {
      const { data, error } = await db.from('faqs').select('*').order('id', { ascending: true });
      if (error) { console.error('Gagal memuat FAQ:', error); return; }

      const faqContainer = document.querySelector('#faq .space-y-4');
      const adminFaqTable = document.getElementById('adminFaqTableBody');
      if (faqContainer) faqContainer.innerHTML = '';
      if (adminFaqTable) adminFaqTable.innerHTML = '';

      data.forEach(faq => {
        if (faqContainer) {
          faqContainer.innerHTML += `
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
              <button onclick="toggleFaq(this)" class="w-full p-5 text-left font-display font-semibold text-slate-800 flex justify-between items-center text-sm">
                <span>${faq.question}</span>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
              </button>
              <div class="hidden p-5 pt-0 text-xs text-slate-600 border-t border-slate-100 bg-slate-50/50">
                ${faq.answer}
              </div>
            </div>`;
        }

        if (adminFaqTable) {
          adminFaqTable.innerHTML += `
            <tr>
              <td class="p-3 font-medium text-slate-800">${faq.question}</td>
              <td class="p-3 text-right space-x-2">
                <button onclick="editFaq(${faq.id}, '${faq.question}', '${faq.answer.replace(/'/g, "\\'")}')" class="text-amber-600 font-bold hover:underline">Edit</button>
                <button onclick="deleteFaq(${faq.id})" class="text-rose-600 font-bold hover:underline">Hapus</button>
              </td>
            </tr>`;
        }
      });
    }

    // 3. LOGIN PETUGAS
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const { data, error } = await db
          .from('petugas')
          .select('*')
          .eq('username', username)
          .eq('password', password)
          .single();

        if (error || !data) {
          showToast('Username atau password salah!');
          return;
        }

        closeModal('loginModal');
        showToast('Login Berhasil! Masuk ke Dashboard...');
        
        // Sembunyikan halaman utama, tampilkan dashboard admin
        document.querySelector('header').classList.add('hidden');
        document.querySelector('section#beranda').classList.add('hidden');
        document.querySelector('div.bg-amber-400').classList.add('hidden');
        document.querySelector('section#layanan').classList.add('hidden');
        document.querySelector('section#jadwal').classList.add('hidden');
        document.querySelector('section#program').classList.add('hidden');
        document.querySelector('section#faq').classList.add('hidden');
        document.querySelector('section#kontak').classList.add('hidden');
        document.querySelector('footer').classList.add('hidden');

        document.getElementById('adminDashboard').classList.remove('hidden');
        e.target.reset();
      } catch (err) {
        console.error(err);
        showToast('Terjadi kesalahan saat login.');
      }
    }

    function handleLogout() {
      location.reload(); // Refresh kembali ke halaman utama publik
    }

    // 4. CRUD DOKTER
    function openDoctorModal() {
      document.getElementById('doctorId').value = '';
      document.getElementById('doctorForm').reset();
      document.getElementById('doctorModalTitle').innerText = 'Tambah Data Dokter';
      openModal('doctorModal');
    }

    function editDoctor(id, name, title, specialty, days, time) {
      document.getElementById('doctorId').value = id;
      document.getElementById('docName').value = name;
      document.getElementById('docTitle').value = title;
      document.getElementById('docSpecialty').value = specialty;
      document.getElementById('docDays').value = days;
      document.getElementById('docTime').value = time;
      document.getElementById('doctorModalTitle').innerText = 'Edit Data Dokter';
      openModal('doctorModal');
    }

    async function saveDoctor(e) {
      e.preventDefault();
      const id = document.getElementById('doctorId').value;
      const name = document.getElementById('docName').value;
      const title = document.getElementById('docTitle').value;
      const specialty = document.getElementById('docSpecialty').value;
      const days = document.getElementById('docDays').value;
      const time = document.getElementById('docTime').value;

      if (id) {
        await db.from('doctors').update({ name, title, specialty, days, time }).eq('id', id);
        showToast('Jadwal dokter berhasil diperbarui!');
      } else {
        await db.from('doctors').insert([{ name, title, specialty, days, time }]);
        showToast('Dokter baru berhasil ditambahkan!');
      }
      closeModal('doctorModal');
      loadPublicDoctors();
    }

    async function deleteDoctor(id) {
      if (confirm('Yakin ingin menghapus dokter ini?')) {
        await db.from('doctors').delete().eq('id', id);
        showToast('Dokter berhasil dihapus!');
        loadPublicDoctors();
      }
    }

    // 5. CRUD FAQ
    function openFaqModal() {
      document.getElementById('faqId').value = '';
      document.getElementById('faqForm').reset();
      document.getElementById('faqModalTitle').innerText = 'Tambah Data FAQ';
      openModal('faqModal');
    }

    function editFaq(id, question, answer) {
      document.getElementById('faqId').value = id;
      document.getElementById('faqQuestion').value = question;
      document.getElementById('faqAnswer').value = answer;
      document.getElementById('faqModalTitle').innerText = 'Edit Data FAQ';
      openModal('faqModal');
    }

    async function saveFaq(e) {
      e.preventDefault();
      const id = document.getElementById('faqId').value;
      const question = document.getElementById('faqQuestion').value;
      const answer = document.getElementById('faqAnswer').value;

      if (id) {
        await db.from('faqs').update({ question, answer }).eq('id', id);
        showToast('FAQ berhasil diperbarui!');
      } else {
        await db.from('faqs').insert([{ question, answer }]);
        showToast('FAQ baru berhasil ditambahkan!');
      }
      closeModal('faqModal');
      loadPublicFaqs();
    }

    async function deleteFaq(id) {
      if (confirm('Yakin ingin menghapus FAQ ini?')) {
        await db.from('faqs').delete().eq('id', id);
        showToast('FAQ berhasil dihapus!');
        loadPublicFaqs();
      }
    }

    // Fungsi Pendukung Lainnya
    function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('hidden'); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-3 border-l-4 border-amber-500`;
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-amber-400"></i><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }
    function toggleFaq(btn) { btn.nextElementSibling.classList.toggle('hidden'); }
  </script>
