                  <span className="text-slate-400">{art.date}</span>
                </div>
                <h3 className="font-bold text-base text-slate-800">{art.title}</h3>
                <p className="text-xs text-slate-500 leading-relaxed">{art.desc}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- 9. PENGADUAN VIEW ---
    function PengaduanView({ pengaduanList, setPengaduanList }) {
      const [nama, setNama] = useState('');
      const [isi, setIsi] = useState('');
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), nama, tanggal: 'Hari Ini', isi, status: 'Menunggu Tanggapan' };
        setPengaduanList([item, ...pengaduanList]);
        setNama('');
        setIsi('');
        setSubmitted(true);
      };

      return (
        <div className="container mx-auto px-4 py-8 max-w-4xl space-y-8">
          <div>
            <h2 className="text-2xl font-bold text-slate-800">Pengaduan & Saran Masyarakat</h2>
            <p className="text-xs text-slate-500 mt-1">Layanan aspirasi publik untuk peningkatan mutu pelayanan Puskesmas Tarailu.</p>
          </div>

          <form onSubmit={handleSubmit} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            {submitted && <div className="p-3 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-xl">Terima kasih, pengaduan/saran Anda telah berhasil terkirim.</div>}
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Nama Pelapor / Pengunjung</label>
              <input type="text" required className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-teal-500" value={nama} onChange={e => setNama(e.target.value)} placeholder="Nama Anda" />
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Isi Pengaduan / Masukan</label>
              <textarea required rows="4" className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-teal-500" value={isi} onChange={e => setIsi(e.target.value)} placeholder="Tuliskan masukan atau keluhan Anda..."></textarea>
            </div>
            <button type="submit" className="py-2.5 px-6 bg-teal-600 text-white font-bold rounded-xl text-xs hover:bg-teal-700 transition">Kirim Saran / Pengaduan</button>
          </form>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
            <h3 className="font-bold text-slate-800 text-sm">Daftar Aspirasi Terbaru</h3>
            <div className="divide-y text-xs">
              {pengaduanList.map(p => (
                <div key={p.id} className="py-3 space-y-1">
                  <div className="flex justify-between font-bold text-slate-800">
                    <span>{p.nama}</span>
                    <span className="text-[10px] text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full">{p.status}</span>
                  </div>
                  <p className="text-slate-600">{p.isi}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- 10. KONTAK VIEW ---
    function KontakView() {
      return (
        <div className="container mx-auto px-4 py-8 max-w-4xl space-y-6">
          <div>
            <h2 className="text-2xl font-bold text-slate-800">Kontak & Lokasi</h2>
            <p className="text-xs text-slate-500 mt-1">Hubungi kami untuk informasi lebih lanjut atau panggilan darurat.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="font-bold text-slate-800 text-base">Informasi Alamat</h3>
              <div className="space-y-3 text-xs text-slate-600">
                <div className="flex items-start gap-2">
                  <IconMapPin />
                  <span>Jl. Trans Sulawesi, Desa Tarailu, Kec. Sampaga, Kab. Mamuju, Sulawesi Barat (91563)</span>
                </div>
                <div className="flex items-center gap-2">
                  <IconPhone />
                  <span>Call Center / WA: (0852) 9988-7766</span>
                </div>
                <div className="flex items-center gap-2">
                  <IconClock />
                  <span>UGD & Ambulans: Standby 24 Jam</span>
                </div>
              </div>
            </div>

            <div className="bg-slate-800 text-white p-6 rounded-2xl shadow-sm flex flex-col justify-between">
              <div>
                <h3 className="font-bold text-base mb-2">Panggilan Darurat UGD</h3>
                <p className="text-xs text-slate-300">Hubungi nomor ini khusus untuk kecelakaan atau kondisi gawat darurat medis.</p>
              </div>
              <div className="mt-4 pt-4 border-t border-slate-700">
                <a href="tel:085299887766" className="block text-center py-3 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl text-sm transition">
                  📞 Hubungi UGD (0852) 9988-7766
                </a>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 11. LOGIN VIEW ---
    function LoginView({ setIsLoggedIn, navTo }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        if (username === 'admin' && password === 'admin') {
          setIsLoggedIn(true);
          navTo('admin');
        } else {
          alert('Username/Password salah! (Gunakan: admin / admin)');
        }
      };

      return (
        <div className="container mx-auto px-4 py-12 max-w-md">
          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <div className="text-center">
              <h2 className="text-xl font-bold text-slate-800">Login Petugas Puskesmas</h2>
              <p className="text-xs text-slate-500 mt-1">Masukkan kredensial akun SIPELITA Anda.</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Username</label>
                <input type="text" required className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-teal-500" value={username} onChange={e => setUsername(e.target.value)} placeholder="Username" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" required className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-teal-500" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" />
              </div>
              <button type="submit" className="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs transition">
                Masuk Sistem
              </button>
            </form>
            <div className="text-center text-[11px] text-slate-400">Demo Akun: Username: <strong>admin</strong> | Password: <strong>admin</strong></div>
          </div>
        </div>
      );
    }

    // --- 12. ADMIN DASHBOARD VIEW ---
    function AdminView({ isLoggedIn, setIsLoggedIn, registrations, pengaduanList, navTo }) {
      if (!isLoggedIn) {
        return (
          <div className="container mx-auto px-4 py-12 text-center">
            <p className="text-xs text-slate-500 mb-4">Anda belum login sebagai petugas.</p>
            <button onClick={() => navTo('login')} className="px-4 py-2 bg-teal-600 text-white rounded-lg text-xs font-bold">Login Sekarang</button>
          </div>
        );
      }

      return (
        <div className="container mx-auto px-4 py-8 max-w-6xl space-y-8">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-2xl font-bold text-slate-800">Dashboard Administrator</h2>
              <p className="text-xs text-slate-500 mt-1">Ringkasan pendaftaran dan pelayanan harian SIPELITA.</p>
            </div>
            <button onClick={() => { setIsLoggedIn(false); navTo('beranda'); }} className="px-4 py-2 bg-red-600 text-white text-xs font-bold rounded-xl">Keluar / Logout</button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 font-bold uppercase">Total Pendaftaran Online</span>
              <div className="text-4xl font-black text-teal-600 my-2">{registrations.length}</div>
              <span className="text-[11px] text-slate-400">Pasien Terdaftar Hari Ini</span>
            </div>
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 font-bold uppercase">Pengaduan Masuk</span>
              <div className="text-4xl font-black text-amber-600 my-2">{pengaduanList.length}</div>
              <span className="text-[11px] text-slate-400">Laporan Aspirasi Warga</span>
            </div>
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 font-bold uppercase">Status Layanan UGD</span>
              <div className="text-xl font-bold text-emerald-600 my-2">24 Jam Standby</div>
              <span className="text-[11px] text-slate-400">Tim Medis Jaga Siap</span>
            </div>
          </div>
        </div>
      );
    }

    // RENDER REACT ROOT
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
