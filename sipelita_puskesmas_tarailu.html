<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPELITA - Puskesmas Tarailu</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              teal: '#0d9488',
              darkteal: '#0f766e',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SVG Icons Helper Components ---
    const IconStethoscope = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.5 12.572l-7.5 7.428l-7.5 -7.428m0 -4.572a4.5 4.5 0 0 1 7.5 -3.286a4.5 4.5 0 0 1 7.5 3.286v4.572" /></svg>;
    const IconCalendar = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" strokeWidth="2"/><path strokeLinecap="round" strokeWidth="2" d="M16 2v4M8 2v4M3 10h18"/></svg>;
    const IconClock = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" strokeWidth="2"/><path strokeLinecap="round" strokeWidth="2" d="M12 7v5l3 3"/></svg>;
    const IconUser = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="10" cy="7" r="4" strokeWidth="2"/></svg>;
    const IconPhone = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>;
    const IconMapPin = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
    const IconCheckCircle = () => <svg className="w-5 h-5 text-emerald-500 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconAlert = () => <svg className="w-5 h-5 text-amber-500 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>;
    const IconMenu = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>;
    const IconClose = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
    const IconUsers = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>;
    const IconFileText = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
    const IconSearch = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;

    // --- INITIAL MOCK DATA ---
    const initialQueues = {
      'Poli Umum': { active: 'A-018', total: 45, waiting: 12, doctor: 'dr. Ahmad Pratama' },
      'Poli Gigi': { active: 'B-008', total: 20, waiting: 5, doctor: 'drg. Rina Sulistia' },
      'Poli KIA/KB': { active: 'C-012', total: 30, waiting: 8, doctor: 'Bidan Nurbaya, S.ST' },
      'Laboratorium': { active: 'L-015', total: 25, waiting: 4, doctor: 'Analis Kesehatan' },
    };

    const initialSchedule = [
      { poli: 'Poli Umum', doctor: 'dr. Ahmad Pratama', days: 'Senin - Sabtu', time: '08:00 - 14:00 WITA', status: 'Buka' },
      { poli: 'Poli Gigi', doctor: 'drg. Rina Sulistia', days: 'Senin - Kamis', time: '08:30 - 12:30 WITA', status: 'Buka' },
      { poli: 'Poli KIA / KB', doctor: 'Bidan Nurbaya, S.ST', days: 'Senin - Sabtu', time: '08:00 - 13:00 WITA', status: 'Buka' },
      { poli: 'Laboratorium', doctor: 'Tim Laboratorium', days: 'Senin - Sabtu', time: '08:00 - 12:00 WITA', status: 'Buka' },
      { poli: 'UGD & Rawat Inap', doctor: 'Tim Medis Jaga', days: 'Setiap Hari', time: '24 Jam Nonstop', status: 'Buka 24H' },
    ];

    const initialComplaints = [
      { id: 'PGD-001', date: '2026-09-20', name: 'Bambang S.', status: 'Selesai', complaint: 'Waktu tunggu obat di farmasi agak lama saat jam padat.', response: 'Terima kasih masukannya, kami telah menambah loket penyerahan resep obat.' },
      { id: 'PGD-002', date: '2026-09-22', name: 'Siti Rahma', status: 'Diproses', complaint: 'AC di ruang tunggu pendaftaran terasa kurang dingin.', response: 'Sedang dalam perbaikan oleh teknisi.' }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('beranda');
      const [profilSubTab, setProfilSubTab] = useState('umum'); // 'umum' | 'struktur'
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      // Dynamic States
      const [queues, setQueues] = useState(initialQueues);
      const [complaints, setComplaints] = useState(initialComplaints);
      const [userTickets, setUserTickets] = useState([]);
      const [adminLoggedIn, setAdminLoggedIn] = useState(false);

      // Notification modal
      const [modalTicket, setModalTicket] = useState(null);

      // Handle tab change
      const navTo = (tab, sub = 'umum') => {
        setActiveTab(tab);
        if (tab === 'profil') setProfilSubTab(sub);
        setIsMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="flex-col flex min-h-screen">
          {/* TOP EMERGENCY BAR */}
          <div className="bg-emerald-800 text-white text-xs md:text-sm py-2 px-4 flex justify-between items-center no-print">
            <div className="flex items-center gap-4 container mx-auto">
              <span className="flex items-center gap-1 font-semibold animate-pulse">
                <span className="w-2 h-2 rounded-full bg-red-400"></span> UGD 24 JAM READY
              </span>
              <span className="hidden md:inline">| Puskesmas Tarailu, Kab. Mamuju, Sulawesi Barat</span>
              <span className="ml-auto font-mono flex items-center gap-1">
                <IconPhone /> Darurat: <strong>(0852) 9988-7766</strong>
              </span>
            </div>
          </div>

          {/* MAIN HEADER & NAVIGATION */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm no-print">
            <div className="container mx-auto px-4 py-3 flex justify-between items-center">
              {/* BRANDING */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => navTo('beranda')}>
                <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-teal-600 flex items-center justify-center text-white font-black text-xl shadow-md">
                  P
                </div>
                <div>
                  <h1 className="font-extrabold text-base md:text-xl text-slate-800 leading-tight tracking-tight">
                    SIPELITA <span className="text-teal-600 font-bold text-xs md:text-sm block md:inline">Puskesmas Tarailu</span>
                  </h1>
                  <p className="text-xs text-slate-500 hidden md:block">Sistem Informasi Pelayanan Kesehatan Tarailu Online</p>
                </div>
              </div>

              {/* DESKTOP NAV */}
              <nav className="hidden lg:flex items-center space-x-1 text-sm font-medium text-slate-600">
                <button onClick={() => navTo('beranda')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'beranda' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Beranda</button>
                
                {/* PROFIL DROPDOWN SIMULATED */}
                <button onClick={() => navTo('profil', 'umum')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'profil' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Profil</button>
                <button onClick={() => navTo('layanan')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'layanan' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Layanan</button>
                <button onClick={() => navTo('jadwal')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'jadwal' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Jadwal</button>
                <button onClick={() => navTo('pendaftaran')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'pendaftaran' ? 'bg-emerald-600 text-white font-semibold shadow-sm hover:bg-emerald-700' : 'hover:bg-slate-100 text-emerald-700 font-semibold'}`}>+ Daftar Online</button>
                <button onClick={() => navTo('antrean')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'antrean' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Cek Antrean</button>
                <button onClick={() => navTo('informasi')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'informasi' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Informasi</button>
                <button onClick={() => navTo('pengaduan')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'pengaduan' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Pengaduan</button>
                <button onClick={() => navTo('kontak')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'kontak' ? 'bg-teal-50 text-teal-700 font-semibold' : 'hover:bg-slate-100'}`}>Kontak</button>

                {adminLoggedIn ? (
                  <button onClick={() => navTo('admin')} className="ml-2 px-3 py-1.5 bg-amber-500 text-white text-xs font-semibold rounded-lg hover:bg-amber-600">Dashboard Admin</button>
                ) : (
                  <button onClick={() => navTo('login')} className="ml-2 px-3 py-1.5 border border-slate-300 text-slate-600 text-xs font-semibold rounded-lg hover:bg-slate-50">Login</button>
                )}
              </nav>

              {/* MOBILE MENU TOGGLE */}
              <div className="lg:hidden flex items-center gap-2">
                <button onClick={() => navTo('pendaftaran')} className="px-3 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded-lg">Daftar</button>
                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                  {isMobileMenuOpen ? <IconClose /> : <IconMenu />}
                </button>
              </div>
            </div>

            {/* MOBILE NAV DRAWER */}
            {isMobileMenuOpen && (
              <div className="lg:hidden bg-white border-b border-slate-200 px-4 py-3 space-y-2 text-sm font-medium">
                <button onClick={() => navTo('beranda')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Beranda</button>
                <button onClick={() => navTo('profil', 'umum')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Profil Puskesmas</button>
                <button onClick={() => navTo('profil', 'struktur')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50 pl-6 text-xs text-slate-500">• Struktur Organisasi</button>
                <button onClick={() => navTo('layanan')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Layanan Medis</button>
                <button onClick={() => navTo('jadwal')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Jadwal Dokter</button>
                <button onClick={() => navTo('pendaftaran')} className="block w-full text-left py-2 px-3 rounded bg-emerald-50 text-emerald-700 font-semibold">Pendaftaran Online</button>
                <button onClick={() => navTo('antrean')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Status Antrean</button>
                <button onClick={() => navTo('persyaratan')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Persyaratan Berobat</button>
                <button onClick={() => navTo('informasi')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Berita & Informasi</button>
                <button onClick={() => navTo('pengaduan')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Pengaduan & Saran</button>
                <button onClick={() => navTo('kontak')} className="block w-full text-left py-2 px-3 rounded hover:bg-slate-50">Kontak & Lokasi</button>
                <div className="pt-2 border-t">
                  {adminLoggedIn ? (
                    <button onClick={() => navTo('admin')} className="block w-full text-center py-2 bg-amber-500 text-white rounded font-semibold text-xs">Menu Admin</button>
                  ) : (
                    <button onClick={() => navTo('login')} className="block w-full text-center py-2 border rounded text-xs font-semibold">Login Admin / Petugas</button>
                  )}
                </div>
              </div>
            )}
          </header>

          {/* MAIN DYNAMIC CONTENT */}
          <main className="flex-grow">
            {activeTab === 'beranda' && <BerandaView navTo={navTo} queues={queues} />}
            {activeTab === 'profil' && <ProfilView subTab={profilSubTab} setSubTab={setProfilSubTab} navTo={navTo} />}
            {activeTab === 'layanan' && <LayananView navTo={navTo} />}
            {activeTab === 'jadwal' && <JadwalView navTo={navTo} />}
            {activeTab === 'pendaftaran' && (
              <PendaftaranView 
                onSuccess={(ticket) => {
                  setUserTickets([...userTickets, ticket]);
                  setModalTicket(ticket);
                }} 
                navTo={navTo}
              />
            )}
            {activeTab === 'antrean' && <AntreanView queues={queues} userTickets={userTickets} navTo={navTo} />}
            {activeTab === 'persyaratan' && <PersyaratanView navTo={navTo} />}
            {activeTab === 'informasi' && <InformasiView navTo={navTo} />}
            {activeTab === 'pengaduan' && <PengaduanView complaints={complaints} setComplaints={setComplaints} />}
            {activeTab === 'kontak' && <KontakView />}
            {activeTab === 'login' && <LoginView setAdminLoggedIn={setAdminLoggedIn} navTo={navTo} />}
            {activeTab === 'admin' && (
              <AdminView 
                queues={queues} 
                setQueues={setQueues} 
                complaints={complaints} 
                setComplaints={setComplaints}
                userTickets={userTickets}
                setAdminLoggedIn={setAdminLoggedIn}
                navTo={navTo}
              />
            )}
          </main>

          {/* TICKET POPUP MODAL AFTER SUCCESSFUL REGISTRATION */}
          {modalTicket && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade-in relative">
                <button onClick={() => setModalTicket(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                  <IconClose />
                </button>
                <div className="text-center pb-4 border-b">
                  <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2">
                    <IconCheckCircle />
                  </div>
                  <h3 className="text-xl font-bold text-slate-800">Pendaftaran Berhasil!</h3>
                  <p className="text-xs text-slate-500">Puskesmas Tarailu - Kabupaten Mamuju</p>
                </div>

                <div className="py-4 space-y-3 bg-slate-50 p-4 rounded-xl my-4 border border-dashed border-slate-300 font-mono text-sm">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Kode Tiket:</span>
                    <span className="font-bold text-teal-700">{modalTicket.ticketCode}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Nama Pasien:</span>
                    <span className="font-semibold text-slate-800">{modalTicket.nama}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Poli Tujuan:</span>
                    <span className="font-semibold">{modalTicket.poli}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Tanggal Kunjungan:</span>
                    <span>{modalTicket.tanggal}</span>
                  </div>
                  <div className="flex justify-between items-center pt-2 border-t border-slate-200">
                    <span className="text-slate-500">Nomor Antrean:</span>
                    <span className="text-2xl font-black text-emerald-600">{modalTicket.noAntrean}</span>
                  </div>
                </div>

                <div className="text-xs text-amber-800 bg-amber-50 p-3 rounded-lg border border-amber-200 mb-4">
                  <strong>Penting:</strong> Harap datang 15 menit sebelum jam pelayanan dengan membawa KTP/Kartu BPJS Asli.
                </div>

                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg transition">
                    Cetak Tiket
                  </button>
                  <button onClick={() => { setModalTicket(null); navTo('antrean'); }} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg transition">
                    Lihat Antrean
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-300 text-sm py-12 border-t border-slate-800 no-print">
            <div className="container mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
              <div>
                <div className="flex items-center gap-2 mb-3">
                  <div className="w-8 h-8 rounded bg-teal-500 flex items-center justify-center text-white font-black text-lg">P</div>
                  <span className="font-bold text-lg text-white">Puskesmas Tarailu</span>
                </div>
                <p className="text-xs text-slate-400 leading-relaxed">
                  SIPELITA (Sistem Informasi Pelayanan Kesehatan Tarailu) adalah portal pendaftaran online dan transparansi pelayanan kesehatan masyarakat.
                </p>
              </div>

              <div>
                <h4 className="font-semibold text-white mb-3">Akses Cepat</h4>
                <ul className="space-y-2 text-xs text-slate-400">
                  <li><button onClick={() => navTo('pendaftaran')} className="hover:text-emerald-400">Pendaftaran Online</button></li>
                  <li><button onClick={() => navTo('antrean')} className="hover:text-emerald-400">Live Status Antrean</button></li>
                  <li><button onClick={() => navTo('jadwal')} className="hover:text-emerald-400">Jadwal Dokter & Poli</button></li>
                  <li><button onClick={() => navTo('persyaratan')} className="hover:text-emerald-400">Syarat Berobat BPJS & Umum</button></li>
                </ul>
              </div>

              <div>
                <h4 className="font-semibold text-white mb-3">Jam Pelayanan</h4>
                <div className="text-xs text-slate-400 space-y-1">
                  <p><strong>Rawat Jalan:</strong></p>
                  <p>Senin - Kamis: 08.00 - 14.00 WITA</p>
                  <p>Jumat - Sabtu: 08.00 - 12.00 WITA</p>
                  <p className="mt-2 text-emerald-400 font-semibold">UGD & Ambulans: 24 Jam Nonstop</p>
                </div>
              </div>

              <div>
                <h4 className="font-semibold text-white mb-3">Alamat & Kontak</h4>
                <p className="text-xs text-slate-400 leading-relaxed">
                  Jl. Trans Sulawesi, Desa Tarailu, Kec. Sampaga, Kab. Mamuju, Sulawesi Barat.
                </p>
                <div className="mt-3 text-xs text-slate-300 font-mono">
                  Telp: (0852) 9988-7766<br/>
                  Email: info@puskesmastarailu.go.id
                </div>
              </div>
            </div>

            <div className="container mx-auto px-4 pt-8 mt-8 border-t border-slate-800 text-center text-xs text-slate-500">
              © 2026 UPTD Puskesmas Tarailu. Hak Cipta Dilindungi Undang-Undang. Powered by SIPELITA System.
            </div>
          </footer>
        </div>
      );

    // --- 5. PENDAFTARAN ONLINE VIEW ---
    function PendaftaranView({ onSuccess, navTo }) {
      const [formData, setFormData] = useState({
        nik: '',
        nama: '',
        tgllahir: '',
        nohp: '',
        jenisPasien: 'BPJS', // 'BPJS' | 'Umum'
        nobpjs: '',
        poli: 'Poli Umum',
        tanggalKunjungan: new Date().toISOString().split('T')[0],
        keluhan: ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.nik || !formData.nama || !formData.nohp) {
          alert('Mohon lengkapi NIK, Nama Lengkap, dan No HP Anda.');
          return;
        }

        // Generate Random Ticket
        const prefix = formData.poli === 'Poli Umum' ? 'A' : formData.poli === 'Poli Gigi' ? 'B' : 'C';
        const randomNum = Math.floor(Math.random() * 30) + 10;
        const ticketCode = `TRL-${Date.now().toString().slice(-4)}`;
        const noAntrean = `${prefix}-${randomNum.toString().padStart(3, '0')}`;

        const ticketData = {
          ...formData,
          ticketCode,
          noAntrean,
          createdTime: new Date().toLocaleTimeString('id-ID')
        };

        onSuccess(ticketData);
      };

      return (
        <div className="container mx-auto px-4 py-8 max-w-2xl space-y-6">
          <div className="text-center">
            <h2 className="text-2xl font-bold text-slate-800">Form Pendaftaran Online</h2>
            <p className="text-xs text-slate-500 mt-1">Isi formulir di bawah ini untuk mengambil tiket antrean berobat online.</p>
          </div>

          <form onSubmit={handleSubmit} className="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div>
              <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nomor Induk Kependudukan (NIK KTP)</label>
              <input 
                type="text" 
                maxLength="16"
                required
                placeholder="16 Digit NIK sesuai KTP/KK" 
                value={formData.nik}
                onChange={(e) => setFormData({...formData, nik: e.target.value})}
                className="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
              />
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap Pasien</label>
              <input 
                type="text" 
                required
                placeholder="Sesuai KTP / Kartu Berobat" 
                value={formData.nama}
                onChange={(e) => setFormData({...formData, nama: e.target.value})}
                className="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
              />
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Tanggal Lahir</label>
                <input 
                  type="date"

    // --- 12. ADMIN DASHBOARD VIEW ---
    function AdminView({ queues, setQueues, complaints, setComplaints, userTickets, setAdminLoggedIn, navTo }) {
      const handleNextQueue = (poli) => {
        const current = queues[poli];
        const prefix = current.active.split('-')[0];
        const currentNum = parseInt(current.active.split('-')[1]) || 0;
        const nextNum = (currentNum + 1).toString().padStart(3, '0');

        setQueues({
          ...queues,
          [poli]: {
            ...current,
            active: `${prefix}-${nextNum}`,
            waiting: Math.max(0, current.waiting - 1)
          }
        });
      };

      return (
        <div className="container mx-auto px-4 py-8 max-w-6xl space-y-8">
          <div className="flex justify-between items-center border-b pb-4">

    // RENDER REACT APP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
